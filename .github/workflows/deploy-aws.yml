name: Deploy AWS (Plan-Only)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'aws'
      apply:
        description: 'Actually apply (chargeable resources)'
        required: true
        type: boolean
        default: false

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      apply:
        required: false
        type: boolean
        default: false

env:
  TF_VAR_enable_chargeable_resources: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: aws-plan-only
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce zero-cost cloud guardrail
        run: |
          if [[ "${ADAPTIVEOPS_ALLOW_CLOUD_CHARGES:-false}" != "true" ]]; then
            echo "ADAPTIVEOPS_ALLOW_CLOUD_CHARGES is not 'true'. Halting to prevent chargeable AWS resources."
            echo "apply=${{ inputs.apply }}"
            exit 7
          fi
        env:
          ADAPTIVEOPS_ALLOW_CLOUD_CHARGES: ${{ vars.ADAPTIVEOPS_ALLOW_CLOUD_CHARGES }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: adaptiveops-plan-only-${{ github.run_id }}

      - name: Terraform fmt + validate
        run: |
          terraform fmt -check
          terraform validate
        working-directory: deploy/terraform/aws

      - name: Terraform plan (no apply)
        run: terraform plan -var enable_chargeable_resources=false -out=tfplan
        working-directory: deploy/terraform/aws
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Show plan summary
        run: terraform show -no-color tfplan | head -200
        working-directory: deploy/terraform/aws

      - name: Guard against accidental apply
        if: ${{ inputs.apply == true }}
        run: |
          echo "Chargeable apply explicitly requested but ADAPTIVEOPS_ALLOW_CLOUD_CHARGES is not set to true."
          echo "Nothing was provisioned. Exit code 7."
          exit 7
