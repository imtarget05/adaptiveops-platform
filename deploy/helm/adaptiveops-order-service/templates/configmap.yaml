apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adaptiveops-order-service.fullname" . }}-config
  labels:
    {{- include "adaptiveops-order-service.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.env.SPRING_PROFILES_ACTIVE | quote }}
  DB_HOST: {{ .Values.env.DB_HOST | quote }}
  DB_PORT: {{ .Values.env.DB_PORT | quote }}
  DB_NAME: {{ .Values.env.DB_NAME | quote }}
  RABBITMQ_HOST: {{ .Values.env.RABBITMQ_HOST | quote }}
  RABBITMQ_PORT: {{ .Values.env.RABBITMQ_PORT | quote }}
