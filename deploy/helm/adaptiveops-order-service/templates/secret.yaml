apiVersion: v1
kind: Secret
metadata:
  name: {{ include "adaptiveops-order-service.fullname" . }}-secret
  labels:
    {{- include "adaptiveops-order-service.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USERNAME: {{ "orderuser" | b64enc | quote }}
  DB_PASSWORD: {{ "ordersecret" | b64enc | quote }}
  RABBITMQ_USERNAME: {{ "rabbitmq" | b64enc | quote }}
  RABBITMQ_PASSWORD: {{ "rabbitmqsecret" | b64enc | quote }}
