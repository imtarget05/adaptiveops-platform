# Default values for adaptiveops-order-service.
replicaCount: 2

image:
  repository: adaptiveops/order-service
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "adaptiveops-order-service-sa"

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: NodePort
  port: 8080
  nodePort: 30080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

probes:
  startup:
    path: /actuator/health/liveness
    initialDelaySeconds: 60
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

env:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "orderdb"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"

nodeSelector: {}
tolerations: []
affinity: {}
