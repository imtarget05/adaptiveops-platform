name = "adaptiveops-control-plane"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
API_VERSION = "v1"
CORS_ALLOWED_ORIGINS = "https://adaptiveops.pages.dev,http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173"

[[d1_databases]]
binding = "DB"
database_name = "adaptiveops-d1-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true

# Preview uses its own Worker and D1 database. Set CLOUDFLARE_PREVIEW_D1_ID
# in the preview environment and render this placeholder before deployment.
[env.preview]
name = "adaptiveops-control-plane-preview"

[env.preview.vars]
ENVIRONMENT = "staging"
API_VERSION = "v1"
CORS_ALLOWED_ORIGINS = "https://adaptiveops-dashboard-preview.pages.dev"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "adaptiveops-d1-preview"
database_id = "__PREVIEW_D1_DATABASE_ID__"
migrations_dir = "migrations"

[env.preview.observability]
enabled = true

# Keep production bindings explicit. No workflow in this repository deploys this
# environment automatically; production rollout requires a separate approval.
[env.production]
name = "adaptiveops-control-plane"

[env.production.vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
CORS_ALLOWED_ORIGINS = "https://adaptiveops.pages.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "adaptiveops-d1"
database_id = "65a47b1a-5fb8-4913-9994-3dd21e0b5b3e"
migrations_dir = "migrations"

[env.production.observability]
enabled = true
